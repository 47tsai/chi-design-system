name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository integrity
        run: node scripts/check-integrity.mjs

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Run browser smoke tests
        run: node --test tests/browser-smoke.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
