<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f9fc">
<title>Chi Account Center · 完整互動範例</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../navigation.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800;900&display=swap');
:root{font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1a1a1e;background:#f7f9fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#f7f9fc;color:#1a1a1e}
button,input{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
.demo-shell{width:100%;max-width:480px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;background:#fff;box-shadow:0 20px 60px #10182814;position:relative;overflow:hidden}
.demo-header{height:56px;position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid #eef0f5}
.demo-logo{display:inline-flex;align-items:center;color:inherit;text-decoration:none;font-weight:900;letter-spacing:.06em;font-size:19px}
.demo-logo-mark{width:14px;height:14px;margin:0 3px;border:3px solid #4f46e5;border-radius:50%;position:relative}
.demo-logo-mark:after{content:"";position:absolute;inset:3px;background:#4f46e5;border-radius:50%}
.demo-header-actions{display:flex;align-items:center;gap:12px}
.demo-round-button{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:#f1f3f8;color:#343944;cursor:pointer}
.demo-menu-button{display:grid;place-items:center;width:32px;height:34px;padding:4px;border:0;background:transparent;color:#252833;cursor:pointer}
.demo-menu-glyph{width:20px;height:16px;display:flex;flex-direction:column;justify-content:space-between}
.demo-menu-glyph span{height:2px;width:100%;background:currentColor;border-radius:2px;transition:transform .2s,opacity .2s}
.demo-menu-button[aria-expanded=true] .demo-menu-glyph span:first-child{transform:translateY(7px) rotate(45deg)}
.demo-menu-button[aria-expanded=true] .demo-menu-glyph span:nth-child(2){opacity:0}
.demo-menu-button[aria-expanded=true] .demo-menu-glyph span:last-child{transform:translateY(-7px) rotate(-45deg)}
.demo-popover{position:absolute;z-index:60;top:55px;right:20px;width:240px;padding:10px 0;background:#fff;border:1px solid #0000000a;border-radius:16px;box-shadow:0 10px 30px #0000001f,0 2px 8px #0000000f;transform-origin:top right;transition:opacity .18s,transform .18s}
.demo-popover[hidden],.demo-nav-overlay[hidden],.demo-modal[hidden],.demo-loading[hidden]{display:none!important}
.demo-popover:not([hidden]){animation:pop-in .18s cubic-bezier(.16,1,.3,1)}
.demo-lang-option{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border:0;background:transparent;text-align:left;color:#4b5563;font-size:14px;cursor:pointer}
.demo-lang-option:hover{background:#f7f8fc}
.demo-lang-option[aria-selected=true]{color:#111827;font-weight:600}
.demo-check{color:#2563eb;visibility:hidden;font-weight:700}
.demo-lang-option[aria-selected=true] .demo-check{visibility:visible}
.demo-nav-overlay{position:fixed;inset:56px 0 0;z-index:30;background:#fff;padding:20px max(20px,calc((100vw - 440px)/2));display:flex;flex-direction:column;gap:10px;overflow:auto}
.demo-nav-login{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border:0;border-radius:16px;background:#f7f8fc;color:#2563eb;text-align:left;font-weight:600;cursor:pointer}
.demo-nav-link{padding:13px 8px;color:#252833;text-decoration:none;font-weight:600}
.demo-nav-link:hover{color:#2563eb}
.demo-hero{position:relative;overflow:hidden;padding:40px 20px 32px;background:linear-gradient(180deg,#edf2fc 0%,#f7f9ff 50%,#f4f6fb 100%)}
.demo-hero:before{content:"";position:absolute;width:320px;height:260px;top:-180px;left:50%;transform:translateX(-50%);border-radius:50%;background:#c7d2fe80;filter:blur(55px)}
.demo-hero-content{position:relative;z-index:1;text-align:center}
.demo-hero h1,.demo-hero h2{margin:0;font-size:clamp(27px,7vw,32px);font-weight:900;letter-spacing:-.04em;line-height:1.25;color:#171923}
.demo-gradient-text{background:linear-gradient(135deg,#a78bfa,#6366f1 50%,#3b82f6);background-clip:text;-webkit-background-clip:text;color:transparent}
.demo-primary-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;margin:26px 0 32px;padding:11px 36px;border:0;border-radius:999px;background:linear-gradient(90deg,#4f46e5,#3b82f6);box-shadow:0 4px 14px #3b82f661;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s,opacity .15s}
.demo-primary-button:hover{opacity:.94}.demo-primary-button:active{transform:scale(.97)}
.demo-feature-list{display:grid;gap:14px;text-align:left}
.demo-feature{padding:20px;border:1px solid #ffffffd9;border-radius:18px;background:#fffffff2;box-shadow:0 10px 25px -5px #d7def099,0 6px 12px -6px #d7def066}
.demo-feature-icon{display:grid;place-items:center;width:48px;height:48px;margin-bottom:12px;border-radius:16px;background:linear-gradient(135deg,#dbeafe,#eff6ff);color:#3b82f6}
.demo-feature h3{margin:0 0 6px;color:#2563eb;font-size:18px;font-weight:800}
.demo-feature p{margin:0;color:#667085;font-size:12px;line-height:1.8}
.demo-games{padding:30px 20px;background:#f4f6fb;text-align:center}
.demo-eyebrow{margin:0 0 22px;color:#98a2b3;font-size:11px;font-weight:600;letter-spacing:.18em}
.demo-game-logos{display:flex;align-items:center;justify-content:center;gap:38px;color:#414653}
.demo-game-logo{font-size:19px;font-style:italic;font-weight:900;letter-spacing:-.07em}
.demo-game-tag{display:inline-block;margin-left:3px;padding:2px 4px;border-radius:4px;background:#f97316;color:#fff;font-size:9px;font-style:normal;transform:rotate(-6deg)}
.demo-footer{padding:30px 20px 36px;background:#111113;color:#fff}
.demo-footer-stack{display:grid;gap:24px}
.demo-footer .demo-logo{color:#fff}
.demo-footer .demo-logo-mark{border-color:#818cf8}.demo-footer .demo-logo-mark:after{background:#818cf8}
.demo-footer-language{position:relative}
.demo-footer-trigger{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border:1px solid #333338;border-radius:9px;background:#1a1a1d;color:#d1d5db;font-size:12px;text-align:left;cursor:pointer}
.demo-footer-popover{position:absolute;right:0;bottom:calc(100% + 8px);left:0;z-index:60;padding:8px 0;border:1px solid #3c3b42;border-radius:12px;background:#2b2a30;box-shadow:0 12px 30px #0008;animation:pop-in .18s cubic-bezier(.16,1,.3,1)}
.demo-footer-popover .demo-lang-option{color:#d1d5db;padding:10px 18px}.demo-footer-popover .demo-lang-option:hover{background:#ffffff0d}.demo-footer-popover .demo-lang-option[aria-selected=true]{color:#fff}.demo-footer-popover .demo-check{color:#818cf8}
.demo-footer-links{display:grid;gap:12px;padding-top:4px}.demo-footer-links a{color:#d1d5db;text-decoration:none;font-size:12px}.demo-footer-links a:hover{color:#fff}
.demo-copyright{margin:0;padding-top:16px;border-top:1px solid #ffffff17;color:#6b7280;font-size:10px;letter-spacing:.08em}
.demo-loading,.demo-modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:#0003;backdrop-filter:blur(2px)}
.demo-loading-card{display:grid;place-items:center;width:112px;height:112px;border:1px solid #ffffff1a;border-radius:18px;background:#212124e8;box-shadow:0 20px 50px #0003}
.demo-spinner{width:44px;height:44px;border:4px solid #ffffff30;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.demo-modal{align-items:flex-end;background:#0008;backdrop-filter:blur(5px)}
.demo-modal-card{position:relative;width:100%;max-width:420px;padding:30px 24px 24px;border:1px solid #f0f1f4;border-radius:26px 26px 18px 18px;background:#fff;box-shadow:0 24px 80px #0002;animation:modal-in .25s cubic-bezier(.16,1,.3,1)}
.demo-modal-close{position:absolute;top:14px;right:14px;display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#98a2b3;cursor:pointer}
.demo-modal-close:hover{background:#f3f4f6;color:#344054}
.demo-modal-heading{text-align:center;padding:8px 0 22px}
.demo-modal-heading h2{margin:0;color:#171923;font-size:24px;font-weight:800}
.demo-modal-heading p{margin:7px 0 0;color:#667085;font-size:12px}
.demo-login-form{display:grid;gap:14px}
.demo-input-wrap{position:relative}
.demo-input{width:100%;padding:13px 15px;border:1px solid #e4e7ec;border-radius:12px;background:#f9fafb;color:#1d2939;font-size:14px}
.demo-input:focus{border-color:#3b82f6;background:#fff;outline:3px solid #dbeafe}
.demo-input--password{padding-right:48px}
.demo-eye{position:absolute;top:50%;right:12px;transform:translateY(-50%);padding:6px;border:0;background:transparent;color:#98a2b3;cursor:pointer}
.demo-submit{width:100%;padding:13px;border:0;border-radius:12px;background:#e5e7eb;color:#6b7280;font-size:14px;font-weight:600;cursor:pointer}
.demo-submit:hover{background:#2563eb;color:#fff}
.demo-modal-links{display:flex;justify-content:space-between;padding-top:4px}.demo-modal-links a{color:#3b82f6;font-size:12px;text-decoration:none}
.demo-notice{margin:0;color:#667085;font-size:11px;line-height:1.7}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop-in{from{opacity:0;transform:translateY(-5px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes modal-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(min-width:560px){.demo-modal{align-items:center}.demo-modal-card{border-radius:24px}.demo-hero{padding-top:48px}.demo-feature-list{gap:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="demo-shell">
<div>
<header class="demo-header">
<a href="#" class="demo-logo" aria-label="Chi 首頁">CHI<span class="demo-logo-mark" aria-hidden="true"></span></a>
<div class="demo-header-actions">
<button id="top-lang-btn" class="demo-round-button" type="button" aria-label="選擇語言" aria-expanded="false" aria-controls="top-lang-dropdown">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
</button>
<button id="menu-toggle-btn" class="demo-menu-button" type="button" aria-label="開啟選單" aria-expanded="false" aria-controls="main-nav-overlay"><span class="demo-menu-glyph" aria-hidden="true"><span></span><span></span><span></span></span></button>
</div>
<div id="top-lang-dropdown" class="demo-popover" hidden role="group" aria-label="頁首語言選擇"></div>
</header>
<nav id="main-nav-overlay" class="demo-nav-overlay" aria-label="網站導覽" hidden>
<button id="nav-login-trigger" class="demo-nav-login" type="button"><span aria-hidden="true">↪</span><span>登入</span></button>
<a class="demo-nav-link" href="#features">服務特色 <span style="float:right" aria-hidden="true">↗</span></a>
<a class="demo-nav-link" href="#games">相關服務 <span style="float:right" aria-hidden="true">↗</span></a>
<a class="demo-nav-link" href="#footer">幫助中心 <span style="float:right" aria-hidden="true">↗</span></a>
</nav>
<section class="demo-hero">
<div class="demo-hero-content">
<h1>一個<span class="demo-gradient-text">帳號</span>體驗</h1><h2>Chi 的所有服務</h2>
<button id="hero-login-btn" class="demo-primary-button" type="button">登入 <span aria-hidden="true">→</span></button>
<div id="features" class="demo-feature-list">
<article class="demo-feature"><div class="demo-feature-icon" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2.5"/><path d="M15 8h2M15 12h2M7 16h10" stroke-linecap="round"/></svg></div><h3>通用</h3><p>以一致的介面體驗串連不同裝置與服務，減少重複學習成本。</p></article>
<article class="demo-feature"><div class="demo-feature-icon" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="10" r="2.5"/><path d="M8 16c0-2.2 1.8-4 4-4s4 1.8 4 4"/></svg></div><h3>管理</h3><p>在集中入口查看常用功能與服務資訊，讓重要操作更容易找到。</p></article>
<article class="demo-feature"><div class="demo-feature-icon" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div><h3>串聯</h3><p>透過統一的導覽與視覺規範，讓不同工具之間保持熟悉、一致的使用體驗。</p></article>
</div>
</div>
</section>
<section id="games" class="demo-games"><p class="demo-eyebrow">同時體驗</p><div class="demo-game-logos"><div class="demo-game-logo">CHI SOURCE</div><div class="demo-game-logo" style="font-style:normal;letter-spacing:.08em">STATUS</div></div></section>
</div>
<footer id="footer" class="demo-footer"><div class="demo-footer-stack">
<a href="#" class="demo-logo" aria-label="Chi 首頁">CHI<span class="demo-logo-mark" aria-hidden="true"></span></a>
<div class="demo-footer-language"><button id="footer-lang-btn" class="demo-footer-trigger" type="button" aria-expanded="false" aria-controls="bottom-lang-dropdown"><span><span aria-hidden="true">◎</span>　<span id="current-lang-text">中文(繁體)</span></span><span aria-hidden="true">⌃</span></button><div id="bottom-lang-dropdown" class="demo-footer-popover" hidden role="group" aria-label="頁尾語言選擇"></div></div>
<nav class="demo-footer-links" aria-label="頁尾連結"><a href="#features">服務特色</a><a href="#games">相關服務</a><a href="#footer">聯絡與支援</a></nav>
<p class="demo-copyright">CHI DESIGN SYSTEM · REUSABLE INTERACTIVE EXAMPLE</p>
</div></footer>
</main>
<div id="loading-overlay" class="demo-loading" hidden role="status" aria-label="載入中"><div class="demo-loading-card"><div class="demo-spinner" aria-hidden="true"></div></div></div>
<div id="login-modal" class="demo-modal" hidden role="dialog" aria-modal="true" aria-labelledby="login-title">
<div id="login-modal-backdrop" style="position:absolute;inset:0" aria-hidden="true"></div>
<section class="demo-modal-card">
<button id="close-modal-btn" class="demo-modal-close" type="button" aria-label="關閉登入視窗"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
<div class="demo-modal-heading"><a href="#" class="demo-logo" aria-label="Chi 首頁">CHI<span class="demo-logo-mark" aria-hidden="true"></span></a><h2 id="login-title" style="margin-top:15px">帳號登入</h2><p>這是介面互動示範，不會送出或驗證帳號資料。</p></div>
<form id="login-form" class="demo-login-form"><label><span class="demo-notice" style="display:block;margin-bottom:5px">使用者名稱 / 電子信箱</span><input class="demo-input" name="username" type="text" autocomplete="username" placeholder="使用者名稱 / 電子信箱"></label>
<label class="demo-input-wrap"><span class="demo-notice" style="display:block;margin-bottom:5px">密碼</span><input id="password-input" class="demo-input demo-input--password" name="password" type="password" autocomplete="current-password" placeholder="密碼"><button id="toggle-password-btn" class="demo-eye" type="button" aria-label="顯示密碼" aria-pressed="false"><svg id="eye-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
<button class="demo-submit" type="submit">登入（示範）</button><div class="demo-modal-links"><a href="#login-title">遇到問題</a><a href="#login-title">立即註冊</a></div><p id="login-notice" class="demo-notice" role="status"></p></form>
</section>
</div>
<script>
(function(){
const languages=['中文(简体)','中文(繁體)','Deutsch','English','Español','Français','Indonesia'];
const topBtn=document.getElementById('top-lang-btn'),footerBtn=document.getElementById('footer-lang-btn'),topMenu=document.getElementById('top-lang-dropdown'),footerMenu=document.getElementById('bottom-lang-dropdown'),menuBtn=document.getElementById('menu-toggle-btn'),nav=document.getElementById('main-nav-overlay'),loading=document.getElementById('loading-overlay'),modal=document.getElementById('login-modal');
let selectedLanguage='中文(繁體)',loadingTimer=null,lastFocus=null;
function buildLanguageMenu(menu){menu.innerHTML='';languages.forEach(lang=>{const button=document.createElement('button');button.type='button';button.className='demo-lang-option';button.dataset.lang=lang;button.setAttribute('role','option');button.innerHTML='<span></span><span class="demo-check" aria-hidden="true">✓</span>';button.firstElementChild.textContent=lang;button.addEventListener('click',()=>selectLanguage(lang));menu.append(button)})}
buildLanguageMenu(topMenu);buildLanguageMenu(footerMenu);
function syncLanguages(){document.querySelectorAll('.demo-lang-option').forEach(button=>{const active=button.dataset.lang===selectedLanguage;button.setAttribute('aria-selected',String(active));button.querySelector('.demo-check').style.visibility=active?'visible':'hidden'});document.getElementById('current-lang-text').textContent=selectedLanguage}
function closeLanguages(){topMenu.hidden=true;footerMenu.hidden=true;topBtn.setAttribute('aria-expanded','false');footerBtn.setAttribute('aria-expanded','false')}
function closeNav(){nav.hidden=true;menuBtn.setAttribute('aria-expanded','false');menuBtn.setAttribute('aria-label','開啟選單')}
function closeFloating(){closeLanguages();closeNav()}
function selectLanguage(lang){selectedLanguage=lang;syncLanguages();closeLanguages();(event?.currentTarget)}
function toggleLanguage(button,panel,otherPanel){const willOpen=panel.hidden;closeFloating();if(willOpen){panel.hidden=false;button.setAttribute('aria-expanded','true')}}
topBtn.addEventListener('click',e=>{e.stopPropagation();toggleLanguage(topBtn,topMenu,footerMenu)});
footerBtn.addEventListener('click',e=>{e.stopPropagation();toggleLanguage(footerBtn,footerMenu,topMenu)});
menuBtn.addEventListener('click',e=>{e.stopPropagation();const willOpen=nav.hidden;closeFloating();nav.hidden=!willOpen;menuBtn.setAttribute('aria-expanded',String(willOpen));menuBtn.setAttribute('aria-label',willOpen?'關閉選單':'開啟選單')});
document.addEventListener('click',e=>{if(!topMenu.contains(e.target)&&!topBtn.contains(e.target)&&!footerMenu.contains(e.target)&&!footerBtn.contains(e.target)&&!nav.contains(e.target)&&!menuBtn.contains(e.target))closeFloating();if(e.target.closest('.demo-nav-link'))closeNav()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const hadLang=!topMenu.hidden||!footerMenu.hidden;const hadNav=!nav.hidden;closeFloating();if(!modal.hidden)closeModal();else if(hadLang)topBtn.focus();else if(hadNav)menuBtn.focus()}});
function openLogin(){closeFloating();lastFocus=document.activeElement;loading.hidden=false;clearTimeout(loadingTimer);loadingTimer=setTimeout(()=>{loading.hidden=true;modal.hidden=false;document.getElementById('login-modal-backdrop').focus?.();document.querySelector('#login-form input').focus()},550)}
function closeLogin(){modal.hidden=true;loading.hidden=true;clearTimeout(loadingTimer);if(lastFocus&&lastFocus.focus)lastFocus.focus()}
document.getElementById('hero-login-btn').addEventListener('click',openLogin);document.getElementById('nav-login-trigger').addEventListener('click',openLogin);document.getElementById('close-modal-btn').addEventListener('click',closeLogin);document.getElementById('login-modal-backdrop').addEventListener('click',closeLogin);
document.getElementById('toggle-password-btn').addEventListener('click',()=>{const input=document.getElementById('password-input'),button=document.getElementById('toggle-password-btn'),visible=input.type==='password';input.type=visible?'text':'password';button.setAttribute('aria-pressed',String(visible));button.setAttribute('aria-label',visible?'隱藏密碼':'顯示密碼')});
document.getElementById('login-form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('login-notice').textContent='此頁僅展示介面，不會傳送或儲存任何登入資料。'});
syncLanguages();
})();
</script>
</body>
</html>
