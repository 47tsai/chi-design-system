<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Chi 系列網站共用的空白起始版型">
<meta name="color-scheme" content="light dark">
<title>Chi Design System · 空白版型</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/tsai97216/chi-design-system/main/logo/blue-w.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/tsai97216/chi-design-system/main/logo/blue-w.png">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
<link rel="stylesheet" href="./navigation.css">
<style>
:root{font-synthesis:none}
html{min-height:100%;scroll-behavior:smooth}
body.chi-page{display:flex;min-height:100vh;min-height:100dvh;flex-direction:column}
.chi-site-header__inner{min-height:64px}
.chi-brand{display:inline-flex;align-items:center;gap:.5rem}
.chi-brand-logo{display:block;width:2.25rem;height:2.25rem;object-fit:contain}
.chi-brand-logo-dark{display:none}
[data-chi-theme=dark] .chi-brand-logo-light{display:none}
[data-chi-theme=dark] .chi-brand-logo-dark{display:block}
.chi-template-actions{display:flex;align-items:center;gap:.5rem}
.chi-template-main{flex:1;min-width:0}
.chi-template-footer{border-top:1px solid var(--chi-color-border);background:var(--chi-color-surface)}
.chi-template-footer__inner{display:flex;min-height:64px;align-items:center;justify-content:space-between;gap:1rem;padding-block:1rem;color:var(--chi-color-text-muted);font-size:var(--chi-text-xs)}
.chi-template-footer a{color:inherit;text-decoration:none}
.chi-template-footer a:hover{color:var(--chi-color-accent)}
@media(max-width:560px){.chi-site-header__inner{gap:.5rem}.chi-nav{gap:.35rem}.chi-nav a{font-size:var(--chi-text-xs)}.chi-template-footer__inner{align-items:flex-start;flex-direction:column;justify-content:center;gap:.25rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="chi-page">
<a class="chi-skip-link" href="#main-content">跳至主要內容</a>
<header class="chi-site-header">
  <div class="chi-container chi-site-header__inner">
    <a class="chi-brand" href="./index.html" aria-label="Chi Design System 空白版型"><img class="chi-brand-logo chi-brand-logo-light" src="https://raw.githubusercontent.com/tsai97216/chi-design-system/main/logo/blue-b.png" alt=""><img class="chi-brand-logo chi-brand-logo-dark" src="https://raw.githubusercontent.com/tsai97216/chi-design-system/main/logo/blue-w.png" alt=""><span>CHI</span></a>
    <nav class="chi-nav" aria-label="主要導覽">
      <a href="./index.html" aria-current="page">空白版型</a>
      <a href="./elements.html">元件圖鑑</a>
      <a href="./framework-example.html">框架示範</a>
    </nav>
    <div class="chi-template-actions">
      <button class="chi-button chi-button--icon" id="theme-toggle" type="button" aria-label="切換色彩主題" title="切換色彩主題"><span id="theme-icon" aria-hidden="true"><svg class="chi-icon" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20261017-2#moon"></use></svg></span></button>
    </div>
  </div>
</header>
<main class="chi-template-main" id="main-content" tabindex="-1">
  <!-- 空白內容區：各專案從這裡開始建立自己的頁面，不預設加入 Hero、卡片或其他內容元件。 -->
</main>
<footer class="chi-template-footer">
  <div class="chi-container chi-template-footer__inner">
    <span>CHI · Shared interface foundation</span>
    <a href="./elements.html">元件圖鑑</a>
  </div>
</footer>
<script>
(() => {
  const root = document.documentElement;
  const button = document.getElementById('theme-toggle');
  const icon = document.getElementById('theme-icon');
  const saved = (() => { try { return localStorage.getItem('chi-theme'); } catch { return null; } })();
  const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const apply = (theme) => {
    if (theme === 'dark') root.setAttribute('data-chi-theme', 'dark');
    else root.removeAttribute('data-chi-theme');
    icon.innerHTML = '<svg class="chi-icon" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20261017-2#' + (theme === 'dark' ? 'sun' : 'moon') + '"></use></svg>';
    button.setAttribute('aria-label', theme === 'dark' ? '切換為淺色主題' : '切換為深色主題');
    button.title = theme === 'dark' ? '切換為淺色主題' : '切換為深色主題';
  };
  apply(saved || (systemDark ? 'dark' : 'light'));
  button.addEventListener('click', () => {
    const next = root.getAttribute('data-chi-theme') === 'dark' ? 'light' : 'dark';
    apply(next);
    try { localStorage.setItem('chi-theme', next); } catch {}
  });
})();
</script>
</body>
</html>
